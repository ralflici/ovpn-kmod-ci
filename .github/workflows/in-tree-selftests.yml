---
name: in-tree ovpn selftests
run-name: selftests - ${{ github.event.client_payload.commit.short_sha || github.event.client_payload.commit.sha }} ${{ github.event.client_payload.commit.message }}  # yamllint disable-line rule:line-length

"on":
  repository_dispatch:
    types: [ovpn-selftest]

permissions:
  contents: read

jobs:
  selftests:
    name: selftests - ${{ github.event.client_payload.commit.short_sha || github.event.client_payload.commit.sha }}  # yamllint disable-line rule:line-length
    # Pin the runner image so webhook-triggered checks do not move when
    # GitHub changes the ubuntu-latest alias.
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      # Flatten the repository_dispatch payload into shell variables used by
      # the status helper and checkout steps below.
      CONTEXT: ovpn-ci/selftests
      RUN_URL: >-
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}
      SOURCE_REPO: ${{ github.event.client_payload.source.repo }}
      SOURCE_REF: ${{ github.event.client_payload.source.git_ref }}
      SOURCE_CLONE_URL: ${{ github.event.client_payload.source.clone_url }}
      SOURCE_SHA: ${{ github.event.client_payload.commit.sha }}
      CACHE_BASE_REF: ${{ github.event.client_payload.cache_base.ref }}
      CACHE_BASE_SHA: ${{ github.event.client_payload.cache_base.sha }}
      VNG_REPOSITORY: ralflici/virtme-ng
      VNG_REF: kmod-ci-virtiofs-fixes
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/source
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 1G
      CCACHE_KEY_VERSION: v1
      CCACHE_TRACKED_REFS: >-
        refs/heads/main refs/heads/development refs/heads/net
        refs/heads/development-net

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v5

      - name: Mark source commit pending
        continue-on-error: true
        env:
          GITHUB_STATUS_TOKEN: ${{ secrets.OVPN_NET_NEXT_STATUS_TOKEN }}
        run: |
          ./scripts/post-github-status.sh \
            --repo "${SOURCE_REPO}" \
            --sha "${SOURCE_SHA}" \
            --state pending \
            --context "${CONTEXT}" \
            --description "ovpn selftests are running" \
            --target-url "${RUN_URL}"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install \
            -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            busybox-static \
            ca-certificates \
            ccache \
            cpio \
            dwarves \
            flex \
            git \
            iperf3 \
            iproute2 \
            iputils-ping \
            jq \
            kmod \
            libelf-dev \
            libmbedtls-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libssl-dev \
            make \
            nftables \
            pkg-config \
            procps \
            python3 \
            python3-jsonschema \
            python3-yaml \
            qemu-system-x86 \
            qemu-utils \
            rsync \
            tcpdump \
            util-linux \
            virtiofsd \
            virtme-ng

      - name: Checkout source repository
        run: |
          # Fetch the tested commit and its parent. Blob contents are fetched
          # lazily during the kernel build instead of during checkout.
          git init source
          git -C source remote add origin "${SOURCE_CLONE_URL}"
          git -C source fetch \
            --depth 2 \
            --filter=blob:none \
            origin \
            "${SOURCE_SHA}"
          git -C source checkout --detach FETCH_HEAD
          git -C source rev-parse --verify HEAD~

      - name: Compute ccache key
        id: ccache-key
        run: |
          ./scripts/compute-ccache-key.sh

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.restore-key }}
          restore-keys: ${{ steps.ccache-key.outputs.restore-keys }}

      - name: Checkout virtme-ng
        run: |
          git clone \
            --depth 1 \
            --branch "${VNG_REF}" \
            "https://github.com/${VNG_REPOSITORY}.git" \
            "${RUNNER_TEMP}/virtme-ng"
          git -C "${RUNNER_TEMP}/virtme-ng" rev-parse HEAD

      - name: Run selftests
        run: |
          VNG="${RUNNER_TEMP}/virtme-ng/vng" \
            VNG_VERBOSE="${VNG_VERBOSE:-1}" \
            VNG_CPUS="${VNG_CPUS:-4}" \
            VNG_MEMORY="${VNG_MEMORY:-4096M}" \
            OVPN_VERBOSE="${OVPN_VERBOSE:-1}" \
            KSFT_TIMEOUT="${KSFT_TIMEOUT:-300}" \
            ./scripts/run-kselftests.sh \
            "${GITHUB_WORKSPACE}/source"

      - name: Save ccache
        if: >-
          always() &&
          steps.ccache-key.outputs.save == 'true' &&
          steps.ccache-key.outputs.save-key != '' &&
          steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-key.outputs.save-key }}

      - name: Mark source commit result
        # Run even after a checkout/test failure so the source commit does not
        # remain stuck with a pending external status.
        if: always()
        continue-on-error: true
        env:
          GITHUB_STATUS_TOKEN: ${{ secrets.OVPN_NET_NEXT_STATUS_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success)
              state=success
              description="ovpn selftests passed"
              ;;
            cancelled)
              state=error
              description="ovpn selftests were cancelled"
              ;;
            *)
              state=failure
              description="ovpn selftests failed"
              ;;
          esac

          ./scripts/post-github-status.sh \
            --repo "${SOURCE_REPO}" \
            --sha "${SOURCE_SHA}" \
            --state "${state}" \
            --context "${CONTEXT}" \
            --description "${description}" \
            --target-url "${RUN_URL}"
