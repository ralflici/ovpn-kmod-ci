name = "ovpn-patchwork-listener"
main = "src/index.js"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

[vars]
PATCHWORK_API = "https://patchwork.openvpn.net/api/1.3"
PATCHWORK_PROJECT = "ovpn"
GITHUB_REPOSITORY = "ralflici/ovpn-kmod-ci"
GITHUB_EVENT_TYPE = "ovpn-patchwork"

[[d1_databases]]
binding = "DB"
database_name = "ovpn-patchwork-listener"
database_id = "813b70d5-6a32-4b91-a0ae-488988c1ada1"
